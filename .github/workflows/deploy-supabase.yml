name: Deploy — Supabase (migrações e Edge Functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Confirmar segredos e variáveis
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam em Settings → Secrets and variables → Actions:${missing/PROJECT_REF/SUPABASE_PROJECT_REF}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Ligar ao projecto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migrações
        run: supabase db push

      - name: Publicar Edge Function "app"
        run: supabase functions deploy app --project-ref "$PROJECT_REF" --no-verify-jwt

      # Funções que já não existem no repositório e devem sair do projecto.
      # "migrar-dados" serviu só para a importação do PocketBase (concluída em 2026-11-01).
      - name: Apagar Edge Functions retiradas
        run: |
          for fn in migrar-dados; do
            if supabase functions list --project-ref "$PROJECT_REF" | grep -qw "$fn"; then
              supabase functions delete "$fn" --project-ref "$PROJECT_REF"
            else
              echo "$fn já não existe."
            fi
          done
