name: Deploy — Supabase (migrações e Edge Functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Ligar ao projecto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migrações
        run: supabase db push

      - name: Publicar Edge Function "app"
        run: supabase functions deploy app --project-ref "$PROJECT_REF" --no-verify-jwt
