<!doctype html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#0c4a6e" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Livraria Adventista" />
		<link rel="apple-touch-icon" href="/logo-icon.png" />
		<meta name="description" content="Livraria Adventista — literatura cristã, educação e inspiração. Compre online com entrega ao domicílio." />
		<title>Livraria Adventista</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
		<script>
			if ('serviceWorker' in navigator) {
				const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);
				if (isLocalDev) {
					// Em desenvolvimento, limpar SW/cache antigo que causa tela branca com Vite
					navigator.serviceWorker.getRegistrations().then((regs) => {
						regs.forEach((r) => r.unregister());
					});
					caches.keys().then((keys) => {
						keys.forEach((k) => caches.delete(k));
					});
				} else {
					window.addEventListener('load', () => {
						navigator.serviceWorker.register('/sw.js').catch(() => {});
					});
				}
			}
		</script>
	</body>
</html>
